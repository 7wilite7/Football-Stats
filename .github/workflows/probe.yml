name: probe
on:
  push:
    paths: ["scripts/probe.py",".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests
      - run: python scripts/probe.py
      - run: |
          git config user.name "stats-bot"; git config user.email "stats-bot@users.noreply.github.com"
          git add probe && git commit -m "probe results" && git push
