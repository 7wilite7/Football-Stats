name: update-stats
on:
  schedule:
    # 6am UK all year. GitHub schedules are UTC, so both run and the wrong one for the season skips itself.
    - cron: "0 5 * * *"    # 06:00 UK during summer time (BST)
    - cron: "0 6 * * *"    # 06:00 UK during winter (GMT)
  workflow_dispatch:
    inputs:
      leagues:
        description: "League keys to update (blank = all active)"
        required: false
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/update.yml"]
permissions:
  contents: write
concurrency:
  group: update-stats
  cancel-in-progress: false
env:
  ACTIVE: "EPL LALIGA SERIEA BUNDESLIGA LIGUE1 CHAMPIONSHIP MLS UCL UEL EREDIVISIE SAUDI PORTUGAL SCOTLAND TURKEY"
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Skip the schedule that isn't 6am UK today
        if: github.event_name == 'schedule'
        run: |
          ZONE=$(TZ=Europe/London date +%Z)
          if { [ "$ZONE" = "BST" ] && [ "${{ github.event.schedule }}" != "0 5 * * *" ]; } || \
             { [ "$ZONE" = "GMT" ] && [ "${{ github.event.schedule }}" != "0 6 * * *" ]; }; then
            echo "SKIP=1" >> "$GITHUB_ENV"; echo "Not the 6am UK slot today, skipping"
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests
      - name: Fetch and build, saving after each league
        run: |
          [ "$SKIP" = "1" ] && exit 0
          git config user.name "stats-bot"; git config user.email "stats-bot@users.noreply.github.com"
          LIST="${{ github.event.inputs.leagues }}"; [ -z "$LIST" ] && LIST="$ACTIVE"
          for L in $LIST; do
            python scripts/fetch.py $L || { echo "fetch $L failed"; FAILED="$FAILED $L"; }
            python scripts/build.py || { echo "build failed"; FAILED="$FAILED build($L)"; }
            git add -A data out
            git commit -qm "update $L" || true
            for i in 1 2 3; do git pull -q --rebase origin main && git push -q && break; sleep 5; done
          done
          python scripts/check.py $LIST || FAILED="$FAILED checks(see errors above)"
          git add data/checks.json && git commit -qm "checks" && for i in 1 2 3; do git pull -q --rebase origin main && git push -q && break; sleep 5; done || true
          if [ -n "$FAILED" ]; then echo "::error::Leagues that failed to update:$FAILED (sheet keeps their previous numbers)"; exit 1; fi
      - name: Tell healthchecks.io the update finished
        if: success() && env.SKIP != '1' && github.event_name != 'push'
        env: {HC: "${{ secrets.HC_PING_URL }}"}
        run: |
          if [ -z "$HC" ]; then echo "::warning::HC_PING_URL secret not found"; exit 0; fi
          curl -fsS -m 10 --retry 5 "$HC" && echo "Pinged healthchecks.io (success)"
      - name: Tell healthchecks.io the update failed
        if: failure() && env.SKIP != '1' && github.event_name != 'push'
        env: {HC: "${{ secrets.HC_PING_URL }}"}
        run: |
          [ -n "$HC" ] && curl -fsS -m 10 --retry 5 "$HC/fail" && echo "Pinged healthchecks.io (failure)" || true
